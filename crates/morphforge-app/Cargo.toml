[package]
name = "morphforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "morphforge_app"
path = "src/lib.rs"

[[bin]]
name = "morphforge"
path = "src/main.rs"

[dependencies]
morphforge-core = { path = "../morphforge-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
base64 = "0.22"
include_dir = "0.7"
mime_guess = "2"
dotenvy = "0.15"
boa_engine = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdue = "0.9"
flate2 = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
