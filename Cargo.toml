[workspace]
members = ["crates/morphforge-core", "crates/morphforge-app"]
default-members = ["crates/morphforge-app", "crates/morphforge-core"]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
