<!doctype html><html lang="zh-CN" data-app-entry="mini"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MorphForge Mini</title><link rel="stylesheet" href="/mini.css"></head><body>
<header><strong>MorphForge</strong><button id="miniRecording" hidden><span data-i18n="●录音 · 结束">●录音 · 结束</span></button><select id="miniMode" aria-label="mini模式" data-i18n-aria-label="mini模式"><option value="speech" data-i18n="语音与文字">语音与文字</option><option value="progress" data-i18n="建模进度">建模进度</option><option value="custom" data-i18n="全部">全部</option></select><label><input type="checkbox" id="miniPin"><span data-i18n="置顶">置顶</span></label><button id="miniMain"><span data-i18n="主界面">主界面</span></button><button id="miniClose"><span data-i18n="关闭">关闭</span></button></header>
<main><section id="miniSpeech"><div class="status" id="speechStatus"><span data-i18n="正在连接语音服务…">正在连接语音服务…</span></div><div class="row"><button id="speechStart"><span data-i18n="开始录音">开始录音</span></button><button id="speechStop"><span data-i18n="结束">结束</span></button><button id="speechCancel"><span data-i18n="取消">取消</span></button></div><meter id="speechMeter" min="0" max="1" value="0"></meter><div id="speechPartial" class="partial"></div><textarea id="speechText" rows="3" aria-label="识别文字" placeholder="识别结果可在这里修正" data-i18n-placeholder="识别结果可在这里修正" data-i18n-aria-label="识别文字"></textarea><div class="row"><select id="speechTarget" aria-label="语音输入目标" data-i18n-aria-label="语音输入目标"><option value="modeling" data-i18n="建模输入">建模输入</option></select><button id="speechSend"><span data-i18n="应用文字">应用文字</span></button><button id="speechBuild"><span data-i18n="开始建模">开始建模</span></button><button id="speechClear"><span data-i18n="清空草稿">清空草稿</span></button><button id="speechCopy"><span data-i18n="复制">复制</span></button></div><label><input id="speechAuto" type="checkbox"><span data-i18n="自动同步到选定文本框">自动同步到选定文本框</span></label><div class="row"><label><input id="speechTranslate" type="checkbox"><span data-i18n="自动翻译">自动翻译</span></label><select id="speechTranslationLanguage" aria-label="字幕翻译目标语言" data-i18n-aria-label="字幕翻译目标语言"><option value="zh" data-i18n="中文">中文</option><option value="ja" data-i18n="日文">日文</option><option value="en" data-i18n="英文">英文</option></select></div><div id="speechTranslation" class="partial" aria-live="polite"></div><p class="caption"><span data-i18n="开启翻译后使用当前大模型API，字幕同时显示原文与译文，默认四行各保留两行；输入框仍可修正原文。连续字幕建议在主界面用“字幕”新建，保留末尾文字。">开启翻译后使用当前大模型API，字幕同时显示原文与译文，默认四行各保留两行；输入框仍可修正原文。连续字幕建议在主界面用“字幕”新建，保留末尾文字。</span></p><div id="speechError" role="alert"></div></section>
<section id="miniProgress"><div id="miniRun" class="status"><span data-i18n="待命">待命</span></div><div id="miniTranscript"></div><div class="row"><button id="miniPause"><span data-i18n="暂停">暂停</span></button><button id="miniResume"><span data-i18n="继续">继续</span></button><button id="miniStop"><span data-i18n="停止">停止</span></button></div><div id="miniResources"></div><progress id="miniSendProgress" max="100" value="0"></progress><div id="miniSendStatus"></div></section></main><div id="miniError" hidden role="alert"><span id="miniErrorText"></span><button id="miniErrorClose" aria-label="关闭错误提示" data-i18n-aria-label="关闭错误提示">×</button></div><details id="miniAppearance"><select id="miniUiLanguage" data-language-select aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="auto" data-i18n="跟随系统">跟随系统</option><option value="zh-CN" translate="no">简体中文</option><option value="ja" translate="no">日本語</option><option value="en">English</option></select><summary><span data-i18n="窗口外观">窗口外观</span></summary><label><span data-i18n="不透明度">不透明度</span> <input id="miniOpacity" type="range" min="0.35" max="1" step="0.05" value="1"></label><label><input id="miniCompact" type="checkbox"><span data-i18n="紧凑显示">紧凑显示</span></label></details><footer><span id="miniProject"><span data-i18n="连接中">连接中</span></span><span id="miniWindowStatus"></span><button id="miniOnly"><span data-i18n="仅保留小窗">仅保留小窗</span></button></footer><script type="module" src="/bootstrap.js"></script></body></html>
