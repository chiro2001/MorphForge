<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MorphForge Mini</title><link rel="stylesheet" href="/mini.css"></head><body>
<header><strong>MorphForge</strong><button id="miniRecording" hidden>●录音 · 结束</button><select id="miniMode" aria-label="mini模式"><option value="speech">语音与文字</option><option value="progress">建模进度</option><option value="custom">全部</option></select><label><input type="checkbox" id="miniPin">置顶</label><button id="miniMain">主界面</button><button id="miniClose">关闭</button></header>
<main><section id="miniSpeech"><div class="status" id="speechStatus">正在连接语音服务…</div><div class="row"><button id="speechStart">开始录音</button><button id="speechStop">结束</button><button id="speechCancel">取消</button></div><meter id="speechMeter" min="0" max="1" value="0"></meter><div id="speechPartial" class="partial"></div><textarea id="speechText" rows="3" aria-label="识别文字" placeholder="识别结果可在这里修正"></textarea><div class="row"><select id="speechTarget" aria-label="语音输入目标"><option value="modeling">建模输入</option></select><button id="speechSend">应用文字</button><button id="speechBuild">开始建模</button><button id="speechClear">清空草稿</button><button id="speechCopy">复制</button></div><label><input id="speechAuto" type="checkbox">自动同步到选定文本框</label><p class="caption">连续字幕建议在主界面用“字幕”新建，保留末尾文字。</p><div id="speechError" role="alert"></div></section>
<section id="miniProgress"><div id="miniRun" class="status">待命</div><div id="miniTranscript"></div><div class="row"><button id="miniPause">暂停</button><button id="miniResume">继续</button><button id="miniStop">停止</button></div><div id="miniResources"></div><progress id="miniSendProgress" max="100" value="0"></progress><div id="miniSendStatus"></div></section></main><div id="miniError" hidden role="alert"><span id="miniErrorText"></span><button id="miniErrorClose" aria-label="关闭错误提示">×</button></div><details id="miniAppearance"><summary>窗口外观</summary><label>不透明度 <input id="miniOpacity" type="range" min="0.35" max="1" step="0.05" value="1"></label><label><input id="miniCompact" type="checkbox">紧凑显示</label></details><footer><span id="miniProject">连接中</span><span id="miniWindowStatus"></span><button id="miniOnly">仅保留小窗</button></footer><script type="module" src="/mini.js"></script></body></html>
