<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MorphForge</title>
  <link rel="stylesheet" href="startup.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-live="polite">

  </main>
  <script src="startup.js"></script>

</html>
